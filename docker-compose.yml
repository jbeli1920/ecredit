

services:
  # ============================================
  # APPLICATION SPRING BOOT (avec H2 embarquée)
  # ============================================

  ecredit-backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: hamdi1920/backend:latest
    ports:
      - "8085:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=default
      - SERVER_PORT=8080
      - JAVA_OPTS=-Djava.net.preferIPv4Stack=true
    command: java $JAVA_OPTS -jar /app.jar
    networks:
      - ecredit-network
    restart: unless-stopped

  # ============================================
  # MONITORING (OBLIGATOIRE)
  # ============================================

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - ecredit-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    networks:
      - ecredit-network
    depends_on:
      - prometheus
    restart: unless-stopped

# ============================================
  # SONARQUBE (Code Quality)
  # ============================================
  sonarqube:
    image: sonarqube:community
    container_name: sonarqube
    ports:
      - "9000:9000"
    networks:
      - ecredit-network
    environment:
      - SONAR_JDBC_URL=jdbc:postgresql://db-sonar:5432/sonar
      - SONAR_JDBC_USERNAME=sonar
      - SONAR_JDBC_PASSWORD=sonar
    depends_on:
      - db-sonar
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    restart: unless-stopped

  db-sonar:
    image: postgres:15
    container_name: db-sonar
    networks:
      - ecredit-network
    environment:
      - POSTGRES_USER=sonar
      - POSTGRES_PASSWORD=sonar
      - POSTGRES_DB=sonar
    volumes:
      - postgres_sonar_data:/var/lib/postgresql/data
    restart: unless-stopped
networks:
  ecredit-network:
    driver: bridge
volumes:
  postgres_sonar_data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs: